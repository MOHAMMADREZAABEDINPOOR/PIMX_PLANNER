<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="plBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18" />
      <stop offset="50%" stop-color="#0d1430" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="plNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#ec4899;#38bdf8;#818cf8" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="7s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="plGrid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.35" />
    </linearGradient>
    <filter id="plGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" /><feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes plFloat { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
    @keyframes plPulse { 0%, 100% { r: 10; opacity: 0.8; } 50% { r: 16; opacity: 0.4; } }
    .floating-planner { animation: plFloat 6s ease-in-out infinite; }
  </style>

  <rect width="1200" height="360" fill="url(#plBg)" />

  <!-- 3D Perspective Grid -->
  <g opacity="0.65">
    <line x1="0" y1="260" x2="1200" y2="260" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1" />
    <line x1="600" y1="260" x2="0" y2="360" stroke="url(#plGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="200" y2="360" stroke="url(#plGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="400" y2="360" stroke="url(#plGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="600" y2="360" stroke="url(#plGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="800" y2="360" stroke="url(#plGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="1000" y2="360" stroke="url(#plGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="1200" y2="360" stroke="url(#plGrid)" stroke-width="1.5" />
    <line x1="0" y1="290" x2="1200" y2="290" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />
    <line x1="0" y1="330" x2="1200" y2="330" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5" />
  </g>

  <!-- Ambient Light -->
  <circle cx="200" cy="120" r="140" fill="#38bdf8" opacity="0.09" filter="url(#plGlow)" />
  <circle cx="960" cy="180" r="160" fill="#818cf8" opacity="0.12" filter="url(#plGlow)" />

  <!-- Holographic 3D Isometric Study Desk & Pomodoro Sphere -->
  <g transform="translate(940, 180)" class="floating-planner">
    <!-- Rotating Ring -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#plNeon)" stroke-width="2" stroke-dasharray="8 6" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 6" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite" />
    </circle>

    <!-- Isometric Flashcard / Book Layer 1 -->
    <polygon points="-70,-20 0,-55 70,-20 0,15" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.9" />
    <!-- Layer 2 -->
    <polygon points="-70,-5 0,-40 70,-5 0,30" fill="#0f172a" stroke="#818cf8" stroke-width="2" opacity="0.7" />

    <!-- Pomodoro Energy Orb -->
    <circle cx="0" cy="-20" r="14" fill="#38bdf8" filter="url(#plGlow)">
      <animate attributeName="r" values="12;18;12" dur="3s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#38bdf8;#c084fc;#f43f5e;#38bdf8" dur="8s" repeatCount="indefinite" />
    </circle>

    <!-- Floating Metric Chips -->
    <g transform="translate(-115, -45)">
      <rect x="0" y="0" width="75" height="22" rx="6" fill="#090d1f" stroke="#38bdf8" stroke-width="1" />
      <text x="37" y="15" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">SM-2 SRS</text>
    </g>
    <g transform="translate(60, 25)">
      <rect x="0" y="0" width="82" height="22" rx="6" fill="#090d1f" stroke="#818cf8" stroke-width="1" />
      <text x="41" y="15" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#a5b4fc" text-anchor="middle">GPA 4.0/20</text>
    </g>
    <g transform="translate(-40, 65)">
      <rect x="0" y="0" width="85" height="22" rx="6" fill="#090d1f" stroke="#ec4899" stroke-width="1" />
      <text x="42" y="15" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#f472b6" text-anchor="middle">GEMINI AI</text>
    </g>
  </g>

  <!-- Left Typography -->
  <g transform="translate(80, 140)">
    <g transform="translate(0, -35)">
      <rect x="0" y="-14" width="240" height="24" rx="12" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1" />
      <circle cx="12" cy="-2" r="4" fill="#38bdf8" />
      <text x="26" y="2" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#38bdf8" letter-spacing="2">COGNITIVE OS // ACADEMIC SUITE</text>
    </g>

    <text x="0" y="32" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" font-size="52" font-weight="900" fill="url(#plNeon)" filter="url(#plGlow)" letter-spacing="3">
      PIMX_PLANNER
    </text>

    <text x="0" y="68" font-family="'Fira Code', monospace" font-size="16" font-weight="600" fill="#e2e8f0" letter-spacing="1">
      ⚡ AI-Powered Cognitive OS, Spaced Repetition Flashcards &amp; GPA Suite
    </text>

    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="165" height="26" rx="6" fill="#0c132c" stroke="#38bdf8" stroke-width="1" />
      <text x="82" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">🧠 SM-2 Spaced Rep</text>

      <rect x="175" y="0" width="155" height="26" rx="6" fill="#0c132c" stroke="#818cf8" stroke-width="1" />
      <text x="252" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#a5b4fc" text-anchor="middle">⏱️ Pomodoro Engine</text>

      <rect x="340" y="0" width="150" height="26" rx="6" fill="#0c132c" stroke="#c084fc" stroke-width="1" />
      <text x="415" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#d8b4fe" text-anchor="middle">🤖 Gemini Pro AI</text>

      <rect x="500" y="0" width="150" height="26" rx="6" fill="#0c132c" stroke="#34d399" stroke-width="1" />
      <text x="575" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#6ee7b7" text-anchor="middle">📊 GPA Simulator</text>
    </g>
  </g>

  <line x1="0" y1="358" x2="1200" y2="358" stroke="url(#plNeon)" stroke-width="3" filter="url(#plGlow)" />
</svg>